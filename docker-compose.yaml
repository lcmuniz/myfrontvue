services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: myfrontvue-dev
    ports:
      # Bind to localhost only so the dev server is not reachable from the local network.
      - '127.0.0.1:5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
